# SPDX-License-Identifier: BSD-2-Clause
#
# freebsd-media: load the V4L2 core and the Cedrus (Allwinner A64) decoder at boot.
# Install as /boot/loader.conf.d/v4l2-cedrus.conf (FreeBSD 14 and later read *.conf there).
#
# Loading from the loader, not from rc.conf's kld_list, is the choice when large contiguous
# buffers are needed: the engine's 1080p OUTPUT buffers are 3 MB contiguous each, and physical memory
# fragments as soon as userland has run. Module dependencies (media needs dmabuf_base, cedrus needs
# media) are resolved by the loader from the kernel's MODULE_DEPEND records, but the order is spelled out.
#
# The modules live in /boot/modules (module_path of the stock loader.conf includes it).
dmabuf_base_load="YES"
media_load="YES"
cedrus_load="YES"

# NOTE: dmabuf_base is OUR dma-buf core (sys/dev/dmabuf). drm-kmod ships a different module called
# "dmabuf" (the Linux dma-buf emulation of the GPU stack). With the GPU stack, the stock drm-kmod
# dmabuf.ko must be REPLACED by the bridged one (drm-kmod patch 0006, bsdOS hal/lima/patches), which
# depends on dmabuf_base and so is loaded in addition to it, after it. The stock dmabuf.ko cannot
# import a native descriptor. See docs/INSTALL.md, "GPU stack".

# Tunables read by the cedrus driver at attach time (defaults in brackets; nothing needs to be set):
#hw.cedrus.pm="1"		# [1] power-manage the engine: gate its clocks when idle; 0 keeps it on
#hw.cedrus.lab="0"		# [0] 1 creates /dev/cedrus-lab (register lab) and takes lab_size contiguous bytes
#hw.cedrus.lab_size="8388608"	# [8 MiB] size of the lab buffer
#hw.cedrus.lab_lo_mb="0"	# [0] if non-zero, lowest MiB (from DRAM base) the lab buffer may be placed at

# PLANNED, not in the driver yet: a reserved pool of contiguous memory for the decoder's buffers,
# taken at boot before memory fragments. The name is expected to be hw.cedrus.pool_mb; a tunable the
# driver does not know is ignored by the kernel, so this line is harmless to keep.
#hw.cedrus.pool_mb="64"
